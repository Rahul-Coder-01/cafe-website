<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contact - Brew Cafe</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="font-['Poppins']">
    <header class="max-w-full mx-auto border-b border-[#eadfdb] bg-[#fffaf8]">
      <nav class="mx-auto flex h-16 items-center justify-between px-12">
        <div class="flex items-center gap-3">
          <img src="images/Brew Cafe Logo.png" alt="" class="object-contain" />
        </div>

        <div class="flex items-center gap-8">
          <a href="index.html" class="text-sm text-[#3b211c]">Home</a>
          <a href="menu.html" class="text-sm text-[#3b211c]">Menu</a>
          <a href="gallery.html" class="text-sm text-[#3b211c]">Gallery</a>
          <a href="contact.html" class="text-sm text-[#3b211c]">Contact</a>
        </div>

        <div class="flex items-center gap-3">
          <a
            href="contact.html"
            class="rounded-md bg-[#3b211c] px-5 py-2 text-sm text-white"
            >Order Online</a
          >

          <button
            class="flex h-8 w-8 items-center justify-center rounded-full bg-[#3b211c] text-white"
          >
            <i class="fa-regular fa-user"></i>
          </button>
        </div>
      </nav>
    </header>

    <!-- Contact Heading Section -->
    <section class="bg-[#FFF9F7] px-4 sm:px-6 lg:px-12 py-10 sm:py-12">
      <div class="max-w-7xl mx-auto">
        <div
          class="inline-flex items-center gap-2 bg-[#F6DDD9] text-[#845415] rounded-full px-3 py-1"
        >
          <span class="w-2 h-2 bg-[#845415] rounded-full"></span>

          <span class="text-[10px] sm:text-xs font-medium">
            DIRECT NEIGHBORHOOD DESK
          </span>
        </div>

        <h1
          class="mt-4 text-3xl sm:text-4xl lg:text-5xl font-['Playfair_Display'] font-bold text-[#271310]"
        >
          Get in Touch with Brew Cafe
        </h1>

        <p
          class="mt-4 max-w-2xl text-sm sm:text-base leading-6 text-[#504442] font-normal"
        >
          Have a question, want to book our space for a study group, or just
          want to say hi? We'd love to hear from you.
        </p>
      </div>
    </section>

  
  </body>
</html>
